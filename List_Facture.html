<!DOCTYPE html>
  
<head>
    <title>Reads the XML data using JavaScript</title>
  
    <!-- CSS -->
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }  
        th,
        td {
            text-align: left;
            padding: 8px;
        }  
        tr:nth-child(even) {
            background-color: #a9acaf
        }
        th {
            background-color: #cf5605;
            color: white;
        }
    </style>
  
    
</head>
  
<body>
    <center>
        <p>Selecciona los archivos XML a trabajar</p>
    </center>
    <!-- despues de webkitdirectory se le coloca directory para que solo seleccione directorios no archivos-->
    <input type="file" name="filelist" accept=".xml" webkitdirectory id="filepicker" multiple />
    <ul id="listing"></ul>

    

    <br><br>
    <table id="id">
        <tr>
            <th>Factura</th>
            <th>Fecha</th>
            <th>RFC Emisor</th>
            <th>Nombre Emisor</th>
            <th>Tipo De Comprobante</th>
            <th>Subtotal</th>
            <th>Descuento</th>
            <th>Impuestos Trasladados</th>
            <th>Total</th>
            <th>Forma de pago</th>
            <th>Método de pago</th>
        </tr>
    </table>
    
    <!--JavaScript -->
    <script src="./script_1.js"></script>


</body>
  
</html>
